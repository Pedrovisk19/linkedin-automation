upstream api_upstream {
    server api:8000;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 25m;

    location /healthz { proxy_pass http://api_upstream/healthz; }
    location /api/    { proxy_pass http://api_upstream/; }

    location / {
        # Servira o frontend Next.js quando existir. Por enquanto 404.
        return 404;
    }
}