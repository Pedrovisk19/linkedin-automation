name: developer-brain-ai-api

# Compose minimo para VM Oracle Cloud (Always Free).
# So a API — Postgres fica no Neon, cron no GitHub Actions, sem Redis.
# O bot do Discord (gateway) fica 24/7 e responde aos botoes aprovar/rejeitar.

services:
  api:
    build:
      context: ../
      dockerfile: infra/docker/Dockerfile
      target: api
    restart: unless-stopped
    env_file: [../.env]
    ports: ["8000:8000"]