name: developer-brain-ai

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: dba
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-_change_me_in_prod}
      POSTGRES_DB: ${POSTGRES_DB:-developer_brain}
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dba -d ${POSTGRES_DB:-developer_brain}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../
      dockerfile: infra/docker/Dockerfile
      target: api
    env_file: [../.env]
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }

  worker:
    build:
      context: ../
      dockerfile: infra/docker/Dockerfile
      target: worker
    env_file: [../.env]
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }

  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api]

volumes:
  postgres_data:
  redis_data: