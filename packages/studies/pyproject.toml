[project]
name = "developer-brain-ai-studies"
version = "0.1.0"
description = "Bounded context: studies (Clean Architecture layers)."
requires-python = ">=3.14"
dependencies = ["developer-brain-ai-shared", "pydantic>=2.10"]

[tool.uv.sources]
developer-brain-ai-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/developer_brain_ai_studies"]
