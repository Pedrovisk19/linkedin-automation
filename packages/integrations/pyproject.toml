[project]
name = "developer-brain-ai-integrations"
version = "0.1.0"
description = "Bounded context: integrations (Clean Architecture layers)."
requires-python = ">=3.14"
dependencies = [
  "developer-brain-ai-shared",
  "httpx>=0.28",
  "pydantic>=2.10",
  "sqlalchemy[asyncio]>=2.0.36",
]

[tool.uv.sources]
developer-brain-ai-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/developer_brain_ai_integrations"]
