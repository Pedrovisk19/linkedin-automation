[project]
name = "developer-brain-ai-telegram"
version = "0.1.0"
description = "Bounded context: telegram — recebe mensagens (texto/audio) via Bot API, gera drafts e coleta aprovacao."
requires-python = ">=3.14"
dependencies = [
  "developer-brain-ai-shared",
  "developer-brain-ai-content",
  "developer-brain-ai-journal",
  "pydantic>=2.10",
  "sqlalchemy[asyncio]>=2.0.36",
  "httpx>=0.28",
  "fastapi>=0.118",
  "openai>=1.59",
]

[tool.uv.sources]
developer-brain-ai-shared = { workspace = true }
developer-brain-ai-content = { workspace = true }
developer-brain-ai-journal = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/developer_brain_ai_telegram"]