[project]
name = "developer-brain-ai-shared"
version = "0.1.0"
description = "Shared kernel: base entity, errors, UoW, tenant context, logging, pagination."
requires-python = ">=3.14"
dependencies = ["pydantic>=2.10", "structlog>=24.4", "sqlalchemy>=2.0.36"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/developer_brain_ai_shared"]
