[project]
name = "developer-brain-ai-ai"
version = "0.1.0"
description = "Bounded context: ai (Clean Architecture layers)."
requires-python = ">=3.14"
dependencies = [
  "developer-brain-ai-shared",
  "pydantic>=2.10",
  "openai>=1.59",
  "json-repair>=0.30",
]

[tool.uv.sources]
developer-brain-ai-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/developer_brain_ai_ai"]
