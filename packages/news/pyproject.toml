[project]
name = "developer-brain-ai-news"
version = "0.1.0"
description = "Bounded context: news — fetch de fontes externas (RSS/HN) + dedupe + digest para posts."
requires-python = ">=3.14"
dependencies = [
  "developer-brain-ai-shared",
  "developer-brain-ai-content",
  "developer-brain-ai-ai",
  "pydantic>=2.10",
  "sqlalchemy[asyncio]>=2.0.36",
  "httpx>=0.28",
  "feedparser>=6.0",
]

[tool.uv.sources]
developer-brain-ai-shared = { workspace = true }
developer-brain-ai-content = { workspace = true }
developer-brain-ai-ai = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/developer_brain_ai_news"]