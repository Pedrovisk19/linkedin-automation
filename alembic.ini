[alembic]
script_location = migrations
prepend_sys_path = packages/shared/src packages/identity/src packages/journal/src packages/roadmap/src packages/projects/src packages/studies/src packages/library/src packages/ai/src packages/content/src packages/integrations/src packages/rag/src packages/automation/src apps/api
sqlalchemy.url = postgresql+asyncpg://dba:_change_me_in_prod@localhost:5432/developer_brain

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S