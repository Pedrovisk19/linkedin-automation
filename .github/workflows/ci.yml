name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install UV
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Sync dependencies
        run: uv sync --all-extras --all-packages

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: MyPy
        run: uv run mypy packages apps

  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: dba
          POSTGRES_PASSWORD: test
          POSTGRES_DB: developer_brain_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dba"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
    env:
      DATABASE_URL: postgresql+asyncpg://dba:test@localhost:5432/developer_brain_test
      ARQ_REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-secret-please-replace-me-in-real-env-1234567890
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with: { version: "latest", enable-cache: true }
      - run: uv python install 3.14
      - run: uv sync --all-extras
      - run: uv run alembic upgrade head
      - run: uv run pytest -ra --cov=packages --cov=apps --cov-fail-under=90