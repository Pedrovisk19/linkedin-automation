name: News Fetch (cron 4h)

on:
  schedule:
    - cron: "0 0,4,8,12,16,20 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      OPENAI_CHAT_MODEL: ${{ secrets.OPENAI_CHAT_MODEL }}
      NEWS_TENANT_ID: ${{ secrets.NEWS_TENANT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Sync dependencies
        run: uv sync --all-extras --all-packages

      - name: Migrate DB
        run: uv run alembic upgrade head

      - name: Seed tenant
        run: uv run --directory apps/worker python -m app.seed_tenant

      - name: Fetch news sources
        run: uv run --directory apps/worker python -m app.run_news fetch