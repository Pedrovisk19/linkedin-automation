[project]
name = "developer-brain-ai-worker"
version = "0.1.0"
description = "Arq worker composition root."
requires-python = ">=3.14"
dependencies = [
  "arq>=0.26","redis>=5.2",
  "developer-brain-ai-shared","developer-brain-ai-automation",
  "developer-brain-ai-ai","developer-brain-ai-journal","developer-brain-ai-content",
]

[tool.uv.sources]
developer-brain-ai-shared     = { workspace = true }
developer-brain-ai-automation = { workspace = true }
developer-brain-ai-ai         = { workspace = true }
developer-brain-ai-journal    = { workspace = true }
developer-brain-ai-content    = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
